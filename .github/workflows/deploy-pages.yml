name: Build and publish Seed Seeker Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get this repository
        uses: actions/checkout@v4
        with:
          path: wrapper

      # Pin the upstream release. Pulling "main" made the site change underneath us.
      - name: Get stable Seed Seeker
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: cd0fddd74a39d0c174b871f7892ff0c6fad84a8d
          path: stable

      - name: Get beta Seed Seeker base
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: cd0fddd74a39d0c174b871f7892ff0c6fad84a8d
          path: beta

      - name: Apply Plus features to stable
        run: |
          python wrapper/apply-customisation.py stable
          python wrapper/upgrade-secret-locations.py stable
          python wrapper/upgrade-v4-beta.py shared stable

      - name: Apply Plus features and BETA-3 generator
        run: |
          python wrapper/apply-customisation.py beta
          python wrapper/upgrade-secret-locations.py beta
          python wrapper/upgrade-v4-beta.py shared beta
          python wrapper/upgrade-v4-beta.py beta beta

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stable WebAssembly
        working-directory: stable
        run: ./scripts/build-web-wasm.sh

      - name: Install stable website dependencies
        working-directory: stable/web
        run: npm ci

      - name: Build stable website
        working-directory: stable/web
        run: npm run build -- --base "/shpd-seed-seeker-plus/stable/"

      - name: Build beta WebAssembly
        working-directory: beta
        run: ./scripts/build-web-wasm.sh

      - name: Install beta website dependencies
        working-directory: beta/web
        run: npm ci

      - name: Build beta website
        working-directory: beta/web
        run: npm run build -- --base "/shpd-seed-seeker-plus/"

      - name: Combine versions and add version switch
        run: |
          mkdir -p beta/web/dist/stable
          cp -R stable/web/dist/. beta/web/dist/stable/

          python - <<'PY'
          from pathlib import Path

          def add_switch(path, current, href, other):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              block = f'''
          <div style="position:fixed;right:10px;bottom:10px;z-index:9999;background:#151922;border:1px solid #485064;border-radius:10px;padding:7px 10px;font:12px system-ui;color:#e9edf5;box-shadow:0 3px 14px #0008">
            <strong>{current}</strong><span style="opacity:.55;padding:0 5px">|</span><a href="{href}" style="color:#75e6bd;text-decoration:none">{other}</a>
          </div>
          '''
              p.write_text(s.replace("</body>", block + "\n</body>"), encoding="utf-8")

          add_switch("beta/web/dist/index.html", "SHPD v4.0.0-BETA-3", "stable/", "Use v3.3.8 Stable")
          add_switch("beta/web/dist/stable/index.html", "SHPD v3.3.8 Stable", "../", "Use v4.0.0-BETA-3")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload finished website
        uses: actions/upload-pages-artifact@v3
        with:
          path: beta/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
