name: Validate complete Seed Seeker Plus v4

on:
  push:
    branches:
      - v4-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-port-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get wrapper
        uses: actions/checkout@v4
        with:
          path: wrapper

      - name: Get current v4 Seed Seeker
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: 124f72a3bba25e644f7e9003d8914b4af7f09a37
          path: app

      - name: Fix GitHub Pages item pictures
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/web/src/lib/sprites.ts")
          s=p.read_text()
          s=s.replace('const SHEET_URL = "/third_party/shattered-pixel-dungeon/items.png";',
                      'const SHEET_URL = \`${import.meta.env.BASE_URL}third_party/shattered-pixel-dungeon/items.png\`;')
          s=s.replace('const ICON_SHEET_URL = "/third_party/shattered-pixel-dungeon/item_icons.png";',
                      'const ICON_SHEET_URL = \`${import.meta.env.BASE_URL}third_party/shattered-pixel-dungeon/item_icons.png\`;')
          p.write_text(s)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 22
          working-directory: app/web
          cache: true

      - name: Run core tests
        working-directory: app
        run: cargo test -p shpd-seedfinder-core

      - name: Build browser engine
        working-directory: app
        run: ./scripts/build-web-wasm.sh

      - name: Check web app
        working-directory: app/web
        run: vp check

      - name: Test web app
        working-directory: app/web
        run: vp test

      - name: Build web app
        working-directory: app/web
        run: vp build --base "/shpd-seed-seeker-plus/"

      - name: Verify pictures are packaged
        run: |
          test -f app/web/dist/third_party/shattered-pixel-dungeon/items.png
          test -f app/web/dist/third_party/shattered-pixel-dungeon/item_icons.png
          grep -R "shpd-seed-seeker-plus/third_party/shattered-pixel-dungeon/items.png" app/web/dist/assets/*.js
