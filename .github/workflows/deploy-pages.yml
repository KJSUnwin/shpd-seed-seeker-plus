name: Build and publish Seed Seeker Plus

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get this repository
        uses: actions/checkout@v4
        with:
          path: wrapper

      # Pin the upstream release. Pulling "main" made the site change underneath us.
      - name: Get current v4 Seed Seeker
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: 124f72a3bba25e644f7e9003d8914b4af7f09a37
          path: app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 22
          working-directory: app/web
          cache: true

      - name: Fix GitHub Pages item images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/web/src/lib/sprites.ts")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'const SHEET_URL = "/third_party/shattered-pixel-dungeon/items.png";',
              'const SHEET_URL = import.meta.env.BASE_URL + "third_party/shattered-pixel-dungeon/items.png";'
          )
          s = s.replace(
              'const ICON_SHEET_URL = "/third_party/shattered-pixel-dungeon/item_icons.png";',
              'const ICON_SHEET_URL = import.meta.env.BASE_URL + "third_party/shattered-pixel-dungeon/item_icons.png";'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build WebAssembly
        working-directory: app
        run: ./scripts/build-web-wasm.sh

      - name: Build website
        working-directory: app/web
        run: vp build --base "/shpd-seed-seeker-plus/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload finished website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
