name: Validate Seed Seeker Plus BETA-3

on:
  push:
    branches:
      - v4-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v4-port-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get wrapper
        uses: actions/checkout@v4
        with:
          path: wrapper

      - name: Get known BETA-3 base
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: aa5fe80890bed78a5854f01f6945180a01671517
          path: app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Diagnose CDS-KMF-DQF against BETA-3
        working-directory: app
        run: |
          mkdir -p crates/seedfinder-core/examples
          cat > crates/seedfinder-core/examples/plus_diag.rs <<'RS'
          use shpd_seedfinder_core::challenges::Challenges;
          use shpd_seedfinder_core::main_world::generate_main_world_with_challenges;
          use shpd_seedfinder_core::model::ItemSource;
          use shpd_seedfinder_core::seed::DungeonSeed;
          fn main() {
              let seed = DungeonSeed::from_code("CDS-KMF-DQF").unwrap();
              for bits in [0u16, 8, 32, 64, 8|32, 8|64, 32|64, 8|32|64] {
                  let ch = Challenges::new(bits).unwrap();
                  let world = generate_main_world_with_challenges(seed, 19, ch).unwrap();
                  let ghost = world.quests.ghost.map(|q| q.depth);
                  let mimics: Vec<_> = world.items.iter().filter(|i|
                      i.depth == 3 && matches!(i.source, ItemSource::Mimic | ItemSource::GoldenMimic | ItemSource::CrystalMimic)
                  ).map(|i| format!("{:?}+{}", i.item, i.upgrade)).collect();
                  println!("CASE bits={} ghost={:?} f3_mimics={:?}", bits, ghost, mimics);
              }
          }
          RS
          cargo run -q -p shpd-seedfinder-core --example plus_diag

