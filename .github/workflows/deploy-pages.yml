name: Build and publish Seed Seeker Plus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get this repository
        uses: actions/checkout@v4
        with:
          path: wrapper

      # Pin the upstream release. Pulling "main" made the site change underneath us.
      - name: Get current v4 Seed Seeker
        uses: actions/checkout@v4
        with:
          repository: akhial/shpd-seed-seeker
          ref: 124f72a3bba25e644f7e9003d8914b4af7f09a37
          path: app

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version: 22
          working-directory: app/web
          cache: true

      - name: Fix GitHub Pages item images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/web/src/lib/sprites.ts")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              'const SHEET_URL = "/third_party/shattered-pixel-dungeon/items.png";',
              'const SHEET_URL = import.meta.env.BASE_URL + "third_party/shattered-pixel-dungeon/items.png";'
          )
          s = s.replace(
              'const ICON_SHEET_URL = "/third_party/shattered-pixel-dungeon/item_icons.png";',
              'const ICON_SHEET_URL = import.meta.env.BASE_URL + "third_party/shattered-pixel-dungeon/item_icons.png";'
          )
          p.write_text(s, encoding="utf-8")
          PY

      - name: Add concise secret-room summaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/web/src/designs/one/LevelMapView.tsx")
          s=p.read_text()
          old='''  const title =
    branch === 0
      ? `Floor ${depth} layout`
      : bundle?.map.kind === "imp_vault"
        ? "Imp Vault"
        : "Blacksmith Mine";
'''
          new=old+'''  const secretSummary =
    bundle && branch === 0 && bundle.map.secretRooms.length > 0
      ? bundle.map.secretRooms.map((room, index) => {
          const [left, top, right, bottom] = room;
          const doors = bundle.map.secretDoors.filter((cell) => {
            const x = cell % bundle.map.width;
            const y = Math.floor(cell / bundle.map.width);
            return x >= left && x <= right && y >= top && y <= bottom;
          });
          const door = doors[0];
          let wall = "?";
          if (door !== undefined) {
            const x = door % bundle.map.width;
            const y = Math.floor(door / bundle.map.width);
            wall = y === top ? "N" : y === bottom ? "S" : x === left ? "W" : x === right ? "E" : "?";
          }
          return `Secret room ${index + 1} · ${doors.length} ${doors.length === 1 ? "door" : "doors"} · ${wall}`;
        })
      : [];
'''
          if old not in s:
              raise SystemExit("LevelMapView title anchor changed")
          s=s.replace(old,new,1)
          old2='''      {toolbar}
      <div className="d1-map-stage">
'''
          new2='''      {toolbar}
      {secretSummary.length > 0 && (
        <div className="d1-map-secret-summary">
          {secretSummary.map((line) => <div key={line}>{line}</div>)}
        </div>
      )}
      <div className="d1-map-stage">
'''
          if old2 not in s:
              raise SystemExit("LevelMapView toolbar anchor changed")
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path("app/web/src/designs/one/level-map.css")
          s=p.read_text()
          s += """
          .d1-map-secret-summary {
            margin: 0 12px 8px;
            padding: 6px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 650;
            line-height: 1.45;
            background: color-mix(in srgb, var(--region) 9%, transparent);
            border: 1px solid color-mix(in srgb, var(--region) 30%, transparent);
          }
          """
          p.write_text(s)
          PY

      - name: Build WebAssembly
        working-directory: app
        run: ./scripts/build-web-wasm.sh

      - name: Build website
        working-directory: app/web
        run: vp build --base "/shpd-seed-seeker-plus/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload finished website
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
