name: Analyse Shattered Beta - Full Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyse-beta.yml'

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Download official Shattered builds
        run: |
          curl -L --fail --retry 3 \
            -o stable.jar \
            https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/v3.3.8/ShatteredPD-v3.3.8-Java.jar

          curl -L --fail --retry 3 \
            -o beta.jar \
            https://github.com/00-Evan/shattered-pixel-dungeon/releases/download/4.0.0-beta/ShatteredPD-v4.0.0-BETA-3-Java.jar

      - name: Download CFR decompiler
        run: |
          curl -L --fail --retry 3 \
            -o cfr.jar \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Decompile stable and beta
        run: |
          mkdir -p decompiled-stable decompiled-beta

          java -jar cfr.jar stable.jar \
            --outputdir decompiled-stable \
            --silent true

          java -jar cfr.jar beta.jar \
            --outputdir decompiled-beta \
            --silent true

      - name: Build complete comparison package
        run: |
          mkdir -p comparison/stable comparison/beta

          STABLE=decompiled-stable/com/shatteredpixel/shatteredpixeldungeon
          BETA=decompiled-beta/com/shatteredpixel/shatteredpixeldungeon

          cp -R "$STABLE"/. comparison/stable/
          cp -R "$BETA"/. comparison/beta/

          # Exact same-decompiler comparison. diff returns 1 when differences
          # are found, which is expected, so do not fail the workflow.
          diff -ruN comparison/stable comparison/beta \
            > comparison/v3.3.8-vs-v4.0.0-BETA-3.diff || true

          find comparison/stable -type f | sort \
            > comparison/stable-filelist.txt

          find comparison/beta -type f | sort \
            > comparison/beta-filelist.txt

          {
            echo "Stable: Shattered Pixel Dungeon v3.3.8"
            echo "Beta:   Shattered Pixel Dungeon v4.0.0-BETA-3"
            echo
            echo "Changed Java files:"
            diff -qr comparison/stable comparison/beta || true
          } > comparison/CHANGED-FILES.txt

      - name: Upload full beta comparison
        uses: actions/upload-artifact@v4
        with:
          name: shpd-beta-full-comparison
          path: comparison
          retention-days: 2
